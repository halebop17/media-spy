name: MediaSpy
options:
  bundleIdPrefix: com.mediaspy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# NOTE: MediaSpyKit is compiled from the existing SPM sources into a `framework`
# target shared by the app and the Quick Look appex — NOT consumed as an SPM
# product (a systemLibrary/pkgConfig package bakes in absolute Homebrew paths
# that can't be relocated for bundling). See docs/development-plan.md §8/§12.

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"            # ad-hoc, local dev
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"              # match SPM's relaxed-concurrency mode
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO       # ad-hoc + hardened runtime fails library validation
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

# Makes the CMediaInfo Clang module + headers resolvable in every target that
# imports MediaSpyKit (Swift must load the transitive module at compile time).
# Compile-time only — no -l link flags here; only the framework links the engine.
settingGroups:
  engineModule:
    OTHER_SWIFT_FLAGS:
      - -Xcc
      - -fmodule-map-file=$(SRCROOT)/Sources/CMediaInfo/module.modulemap
      - -Xcc
      - -I$(SRCROOT)/Vendor/engine/include   # built by scripts/build-engine.sh

targets:
  # ======================================================================
  # MediaSpyKit — framework compiled from the SPM sources + C bridge
  # ======================================================================
  MediaSpyKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MediaSpyKit
      - path: Sources/CMediaInfo/module.modulemap
        buildPhase: none
    settings:
      groups: [engineModule]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediaspy.MediaSpyKit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES      # frameworks need Info.plist to codesign
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/engine/lib
        OTHER_LDFLAGS:
          - -lmediainfo
          - -lzen
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../.."           # Versions/A -> app Contents/Frameworks
          - "@executable_path/../Frameworks"

  # ======================================================================
  # MediaSpy.app — SwiftUI application
  # ======================================================================
  MediaSpy:
    type: application
    platform: macOS
    sources:
      - path: Sources/MediaSpyApp
      - path: Support/Assets.xcassets
      - path: Support/Credits.html     # About panel picks it up automatically
        buildPhase: resources
    dependencies:
      - target: MediaSpyKit
        embed: true
        codeSign: true
      - target: MediaSpyQL
        embed: true
    settings:
      groups: [engineModule]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediaspy.MediaSpy
        INFOPLIST_FILE: Support/MediaSpy-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    postBuildScripts:
      - name: "Bundle + relocate engine dylibs"
        shell: /bin/bash
        script: |
          set -euo pipefail
          FW="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$FW"
          # Engine built from source by scripts/build-engine.sh (NOT Homebrew's
          # bottles: those require the build machine's macOS). Its install
          # names are already @rpath.
          ENGINE="${SRCROOT}/Vendor/engine/lib"
          cp -f "$ENGINE/libmediainfo.0.dylib" "$FW/libmediainfo.0.dylib"
          cp -f "$ENGINE/libzen.0.dylib"       "$FW/libzen.0.dylib"
          chmod u+w "$FW/libmediainfo.0.dylib" "$FW/libzen.0.dylib"

          # libmediainfo's libzen dep -> @loader_path (sits next to it, no rpath needed)
          for d in $(otool -L "$FW/libmediainfo.0.dylib" | awk '/libzen/{print $1}'); do
            install_name_tool -change "$d" @loader_path/libzen.0.dylib "$FW/libmediainfo.0.dylib"
          done

          # Nothing shipped may load from Homebrew (absent on users' Macs).
          APPEX="${BUILT_PRODUCTS_DIR}/${PLUGINS_FOLDER_PATH}/MediaSpyQL.appex"
          for bin in "$FW"/*.dylib "$FW/MediaSpyKit.framework/Versions/A/MediaSpyKit" \
                     "${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}" "$APPEX/Contents/MacOS/MediaSpyQL"; do
            [ -f "$bin" ] || continue
            if otool -L "$bin" | grep -q /opt/homebrew; then
              echo "error: $bin links /opt/homebrew" >&2; exit 1
            fi
          done

          # install_name_tool invalidated signatures — re-sign inner-to-outer.
          # (The .app wrapper itself is signed by Xcode after this phase.)
          codesign --force --sign - --timestamp=none "$FW/libzen.0.dylib"
          codesign --force --sign - --timestamp=none "$FW/libmediainfo.0.dylib"
          codesign --force --sign - --timestamp=none "$FW/MediaSpyKit.framework"
          codesign --force --sign - --timestamp=none \
            --entitlements "${SRCROOT}/Support/MediaSpyQL.entitlements" "$APPEX"

  # ======================================================================
  # MediaSpyQL.appex — Quick Look preview extension
  # ======================================================================
  MediaSpyQL:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    dependencies:
      - target: MediaSpyKit
        embed: false          # framework lives in the host app's Frameworks
        link: true
      - sdk: Quartz.framework  # QuickLookUI.QLPreviewingController
    settings:
      groups: [engineModule]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediaspy.MediaSpy.QuickLook
        INFOPLIST_FILE: Support/MediaSpyQL-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/MediaSpyQL.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          # appex/Contents/MacOS -> app/Contents/Frameworks. MUST be @loader_path:
          # a QL extension is hosted by a system process, so @executable_path
          # would resolve to the OS host binary, not this appex.
          - "@loader_path/../../../../Frameworks"
